[workspace]
resolver = "3"
members = [
    "daqapp",
    "daqcore",
    "daqcli",
    "daqcloud",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
daqcore = { path = "daqcore" }

arrow = { version = "54", default-features = false, features = ["ipc"] }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
env_logger = "0.11.10"
chrono = "0.4.44"
log = "0.4.29"
bytemuck = { version = "1.25.0", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.8.1"
rusb = { version = "0.9.4", features = ["vendored"] }
slcan = { git = "https://github.com/LelsersLasers/slcan", rev = "a8c751c6695532a9ea95d62114b30fd18cf89697", features = ["sync"] }
