[workspace]
resolver = "3"
members = [
    "daqapp",
    "daqcore",
    "daqnative",
    "daqviewer",
    "daqweb",
    "daqcli",
    "daqcloud",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
daqcore = { path = "daqcore" }
daqnative = { path = "daqnative" }
daqviewer = { path = "daqviewer" }

arrow = { version = "54", default-features = false, features = ["ipc"] }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
diesel = { version = "2.3.14", default-features = false, features = ["sqlite", "r2d2"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = "0.29"
env_logger = "0.11.10"
chrono = "0.4.44"
log = "0.4.29"
bytemuck = { version = "1.25.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.8.1"
rusb = { version = "0.9.4", features = ["vendored"] }
slcan = { git = "https://github.com/LelsersLasers/slcan", rev = "a8c751c6695532a9ea95d62114b30fd18cf89697", features = ["sync"] }
